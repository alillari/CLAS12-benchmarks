[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clas12-benchmarks"
version = "0.1.0"
description = "Independent external neural baselines for CLAS12"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mmap-ninja>=0.7"]

[project.optional-dependencies]
graphs = ["torch>=2.1", "torch-geometric==2.4.0"]
tracking = ["torch>=2.1", "scikit-learn>=1.3"]
evaluation = ["scikit-learn>=1.3"]
hdf5 = ["h5py>=3.8"]
plotting = ["matplotlib>=3.7", "scikit-learn>=1.3"]

[project.scripts]
clas12-benchmarks = "clas12_benchmarks.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clas12_benchmarks.fm_reference" = ["sources.json"]
